services:
  streamlit:
    image: python:3.11-slim
    container_name: streamlit_supabase_app
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    env_file:
      - .env
    command: >
      bash -c "
      pip install --no-cache-dir -r requirements.txt &&
      streamlit run app.py --server.address=0.0.0.0 --server.port=8501
      "
